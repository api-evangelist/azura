name: Azura
description: 'Azura is an onchain trading platform that lets users trade any onchain asset priced in USD
  without managing wallets, bridging assets, or paying gas fees. Under the tagline "If it''s onchain,
  it''s on Azura," the app offers cross-chain token swaps across multiple blockchains in a single
  transaction, spot trading with multiple order types, token discovery and analysis, portfolio and PnL
  tracking, a referral system, and an Azurite rewards program, all with zero platform trading fees.
  Smart-contract interactions are algorithmically security-audited. Azura is a consumer-facing DeFi
  product (web app at app.azura.xyz) backed by Initialized Capital; it publishes user documentation and
  a blog but does not currently expose a public developer API, SDK, or specification surface.'
